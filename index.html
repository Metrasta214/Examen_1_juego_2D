<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Cuphead Game</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font estilo retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR ARCADE -->
    <nav class="navbar navbar-dark bg-black border-bottom border-warning">
        <div class="container-fluid">
            <span class="navbar-brand mx-auto arcade-title">
                🎮 MINI BOSS BATTLE
            </span>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container-fluid my-4">
        <div class="row justify-content-center">

            <!-- PANEL IZQUIERDO -->
            <div class="col-lg-3 mb-3">
                <div class="card arcade-card shadow-lg">
                    <div class="card-body">

                        <h5 class="text-warning text-center">📜 CONTROLES</h5>
                        <hr class="text-warning">

                        <ul class="arcade-list">
                            <li>🅰 🅳 → Mover</li>
                            <li>⬆ / Espacio → Saltar</li>
                            <li>🖱 Click → Disparar</li>
                            <li>F → Pantalla completa</li>
                            <li>R → Reiniciar</li>
                        </ul>

                        <hr class="text-warning">

                        <div class="text-center mt-3">
                            <h6 class="hud-label">SCORE</h6>
                            <h4 id="score" class="hud-value">0</h4>

                            <h6 class="hud-label mt-3">HIGH SCORE</h6>
                            <h5 id="highScore" class="hud-value">0</h5>
                        </div>

                    </div>
                </div>
            </div>

            <!-- ZONA DE JUEGO -->
            <div class="col-lg-7 text-center">

                <div class="arcade-frame mx-auto">
                    <canvas id="gameCanvas" width="800" height="500"></canvas>
                </div>

                <div class="mt-3">
                    <button class="btn btn-warning arcade-btn" onclick="location.reload()">
                        🔄 Reiniciar Juego
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center py-3 bg-black border-top border-warning">
        <span class="text-warning small">
            Creado por Álvaro Madrid Morales 🎯 | Proyecto 2D Arcade
        </span>
    </footer>

    <audio id="musicNormal" src="assets/Track-1.mp3" loop></audio>
    <audio id="musicFinal" src="assets/Track-2.mp3" loop></audio>

    <script src="game.js"></script>
</body>
</html>
